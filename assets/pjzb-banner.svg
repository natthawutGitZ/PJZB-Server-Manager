<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="PJZB Server Manager banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.52" stop-color="#11111a"/>
      <stop offset="1" stop-color="#17072c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#a855f7" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="1050" cy="55" r="210" fill="#7c3aed" opacity=".12"/>
  <circle cx="1120" cy="260" r="170" fill="#22d3ee" opacity=".07"/>
  <path d="M65 241H1135" stroke="url(#accent)" stroke-width="3" opacity=".75" filter="url(#glow)"/>
  <rect x="68" y="58" width="67" height="67" rx="15" fill="#dc2626"/>
  <text x="101.5" y="101" text-anchor="middle" fill="white" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">PZ</text>
  <text x="160" y="91" fill="white" font-family="Segoe UI,Arial,sans-serif" font-size="43" font-weight="800" letter-spacing="1">PJZB SERVER MANAGER</text>
  <text x="163" y="129" fill="#c4b5fd" font-family="Segoe UI,Arial,sans-serif" font-size="19" letter-spacing="3">BUILD 42 · WINDOWS · COMPLETE SERVER CONTROL</text>
  <text x="70" y="194" fill="#d4d4d8" font-family="Segoe UI,Arial,sans-serif" font-size="22">One launcher. Everything your server needs.</text>
  <text x="70" y="280" fill="#a1a1aa" font-family="Consolas,monospace" font-size="17">START  /  CONFIG  /  MODS  /  PLAYERS  /  BACKUP  /  UPDATE</text>
  <g transform="translate(990 150)" filter="url(#glow)">
    <path d="M0 30L45 5l45 25v52l-45 25L0 82z" fill="none" stroke="#a855f7" stroke-width="4"/>
    <path d="M45 5v102M0 30l45 25 45-25" fill="none" stroke="#22d3ee" stroke-width="3" opacity=".85"/>
  </g>
</svg>
